server.port=${PORT:8080}
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/khushi;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-minimum-32-chars!!}
app.razorpay.key=${RAZORPAY_KEY_ID:}
app.razorpay.secret=${RAZORPAY_KEY_SECRET:}
